name: Android Release Debug APK CD

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play release track
        required: true
        default: production
        type: choice
        options: [internal, alpha, beta, production]
      release_status:
        description: Play release status
        required: true
        default: completed
        type: choice
        options: [draft, inProgress, halted, completed]
      skip_play_upload:
        description: Build only (do not publish to Play)
        required: true
        default: true
        type: boolean
      publish_github_release:
        description: Create GitHub release and upload APK artifacts
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"
    branches: [dev]
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL || vars.EXPO_PUBLIC_API_BASE_URL || vars.SMOKE_API_BASE_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_DNAME: ${{ secrets.ANDROID_KEY_DNAME }}
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      TARGET_TRACK: ${{ github.event.inputs.track || 'production' }}
      TARGET_STATUS: ${{ github.event.inputs.release_status || 'completed' }}
      SKIP_PLAY_UPLOAD: ${{ github.event_name == 'push' && 'true' || github.event.inputs.skip_play_upload || 'true' }}
      # Export run number so app.config.js can auto-increment the versionCode if needed
      GITHUB_RUN_NUMBER: ${{ github.run_number }} 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate signing configuration
        shell: bash
        run: |
          required_vars=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          missing=0
          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret: ${var}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Validate Play publishing configuration
        if: ${{ env.SKIP_PLAY_UPLOAD != 'true' }}
        shell: bash
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is required when skip_play_upload=false."
            exit 1
          fi
          if [ -z "${ANDROID_PACKAGE_NAME}" ]; then
            echo "::error::ANDROID_PACKAGE_NAME is required when skip_play_upload=false."
            exit 1
          fi

      - name: Run verification suite
        run: pnpm run verify:ci
        
      - name: Prebuild Android
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Decode Keystore and Extract Hashes (Inline)
        id: signing
        shell: bash
        run: |
          echo "Creating android/app directory..."
          mkdir -p android/app
          
          echo "Decoding Keystore from Base64 Secret..."
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release.keystore
          
          if [ ! -f android/app/release.keystore ]; then
            echo "::error::Failed to decode Keystore."
            exit 1
          fi

          echo "Extracting Keystore Fingerprints..."
          keytool -list -v -keystore android/app/release.keystore -alias "${ANDROID_KEY_ALIAS}" -storepass "${ANDROID_KEYSTORE_PASSWORD}" -keypass "${ANDROID_KEY_PASSWORD}" > keystore_info.txt
          
          SHA1=$(grep 'SHA1:' keystore_info.txt | awk '{print $2}')
          SHA256=$(grep 'SHA256:' keystore_info.txt | awk '{print $2}')
          
          echo "Extracted SHA-1: $SHA1"
          echo "Extracted SHA-256: $SHA256"
          
          echo "sha1=$SHA1" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "source=github_secrets" >> $GITHUB_OUTPUT

      - name: Build debug and release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          gradle_args=(
            --no-daemon
            --stacktrace
            --warning-mode
            all
            clean
            assembleDebug
            assembleRelease
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/android/app/release.keystore"
            -Pandroid.injected.signing.store.password="${ANDROID_KEYSTORE_PASSWORD}"
            -Pandroid.injected.signing.key.alias="${ANDROID_KEY_ALIAS}"
            -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD}"
          )

          max_attempts=3
          attempt=1
          while true; do
            if ./gradlew "${gradle_args[@]}"; then
              break
            else
              exit_code=$?
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::Gradle build failed after ${max_attempts} attempts."
              exit "${exit_code}"
            fi

            wait_seconds=$((attempt * 30))
            echo "::warning::Gradle build failed on attempt ${attempt}/${max_attempts} with exit code ${exit_code}. Retrying in ${wait_seconds}s to recover from transient Maven repository errors."
            attempt=$((attempt + 1))
            sleep "${wait_seconds}"
          done

      - name: Export release metadata
        run: |
          mkdir -p build-metadata
          {
            echo "track=${TARGET_TRACK}"
            echo "status=${TARGET_STATUS}"
            echo "keystore_source=${{ steps.signing.outputs.source }}"
            echo "sha1=${{ steps.signing.outputs.sha1 }}"
            echo "sha256=${{ steps.signing.outputs.sha256 }}"
            echo "git_ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
          } > build-metadata/android-release-details.txt
          {
            echo "### Android Release Build"
            echo ""
            cat build-metadata/android-release-details.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release details artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-details
          path: build-metadata/android-release-details.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release with APK artifacts
        id: gh_release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_github_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('android-v{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Android {0}', github.ref_name) || format('Android Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            build-metadata/android-release-details.txt

      - name: Add GitHub release link to summary
        if: ${{ steps.gh_release.outputs.url != '' }}
        shell: bash
        run: |
          {
            echo ""
            echo "### GitHub Release"
            echo "- URL: ${{ steps.gh_release.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Google Play
        if: ${{ env.SKIP_PLAY_UPLOAD != 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/apk/release/*.apk
          track: ${{ env.TARGET_TRACK }}
          status: ${{ env.TARGET_STATUS }}
