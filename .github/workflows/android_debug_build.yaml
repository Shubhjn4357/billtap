name: Android Debug Build

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: android-debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Expo Doctor
        run: pnpm run doctor

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Web Export Smoke Test
        run: pnpm run build:web

      - name: Prebuild
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Prepare Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Ensure debug keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Export debug signing fingerprints
        run: |
          set -euo pipefail
          mkdir -p build-metadata

          DEBUG_SHA1=$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA1:/{print $2; exit}')
          DEBUG_SHA256=$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}')

          {
            echo "debug_sha1=$DEBUG_SHA1"
            echo "debug_sha256=$DEBUG_SHA256"
          } > build-metadata/signing-fingerprints.txt

          {
            echo "### Android Debug Signing Fingerprints"
            echo ""
            cat build-metadata/signing-fingerprints.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Android Debug
        run: |
          cd android
          ./gradlew --no-parallel assembleDebug

      - name: Upload Artifact (Debug)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-dev
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Artifact (Debug Signing Fingerprints)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-signing-fingerprints
          path: build-metadata/signing-fingerprints.txt
          if-no-files-found: error
          retention-days: 14
