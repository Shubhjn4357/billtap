name: Android Release Build

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: android-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64_VAR: ${{ vars.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD_VAR: ${{ vars.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS_VAR: ${{ vars.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD_VAR: ${{ vars.ANDROID_KEY_PASSWORD }}
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL || vars.EXPO_PUBLIC_API_BASE_URL || vars.SMOKE_API_BASE_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      NODE_ENV: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Expo Doctor
        run: pnpm run doctor

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Web Export Smoke Test
        run: pnpm run build:web

      - name: API Smoke E2E (real env)
        env:
          SMOKE_API_BASE_URL_SECRET: ${{ secrets.SMOKE_API_BASE_URL }}
          SMOKE_PHONE_NUMBER_SECRET: ${{ secrets.SMOKE_PHONE_NUMBER }}
          SMOKE_OTP_CODE_SECRET: ${{ secrets.SMOKE_OTP_CODE }}
          SMOKE_CREATE_SECOND_STORE_SECRET: ${{ secrets.SMOKE_CREATE_SECOND_STORE }}
          SMOKE_REMINDER_RECIPIENT_SECRET: ${{ secrets.SMOKE_REMINDER_RECIPIENT }}
          SMOKE_REQUIRED_SECRET: ${{ secrets.SMOKE_REQUIRED }}
          SMOKE_API_BASE_URL_VAR: ${{ vars.SMOKE_API_BASE_URL }}
          SMOKE_PHONE_NUMBER_VAR: ${{ vars.SMOKE_PHONE_NUMBER }}
          SMOKE_OTP_CODE_VAR: ${{ vars.SMOKE_OTP_CODE }}
          SMOKE_CREATE_SECOND_STORE_VAR: ${{ vars.SMOKE_CREATE_SECOND_STORE }}
          SMOKE_REMINDER_RECIPIENT_VAR: ${{ vars.SMOKE_REMINDER_RECIPIENT }}
          SMOKE_REQUIRED_VAR: ${{ vars.SMOKE_REQUIRED }}
        run: |
          export SMOKE_API_BASE_URL="${SMOKE_API_BASE_URL_SECRET:-$SMOKE_API_BASE_URL_VAR}"
          export SMOKE_PHONE_NUMBER="${SMOKE_PHONE_NUMBER_SECRET:-$SMOKE_PHONE_NUMBER_VAR}"
          export SMOKE_OTP_CODE="${SMOKE_OTP_CODE_SECRET:-$SMOKE_OTP_CODE_VAR}"
          export SMOKE_CREATE_SECOND_STORE="${SMOKE_CREATE_SECOND_STORE_SECRET:-$SMOKE_CREATE_SECOND_STORE_VAR}"
          export SMOKE_REMINDER_RECIPIENT="${SMOKE_REMINDER_RECIPIENT_SECRET:-$SMOKE_REMINDER_RECIPIENT_VAR}"
          export SMOKE_REQUIRED="${SMOKE_REQUIRED_SECRET:-$SMOKE_REQUIRED_VAR}"

          if [ -z "${SMOKE_API_BASE_URL}" ] || [ -z "${SMOKE_PHONE_NUMBER}" ]; then
            if [ "${SMOKE_REQUIRED}" = "true" ]; then
              echo "::error::SMOKE_REQUIRED=true, but SMOKE_API_BASE_URL and SMOKE_PHONE_NUMBER are missing."
              echo "Set them in GitHub Secrets or Variables:"
              echo "- secrets.SMOKE_API_BASE_URL or vars.SMOKE_API_BASE_URL"
              echo "- secrets.SMOKE_PHONE_NUMBER or vars.SMOKE_PHONE_NUMBER"
              exit 1
            fi

            echo "::warning::Skipping smoke:e2e (set SMOKE_REQUIRED=true to enforce)."
            exit 0
          fi

          pnpm run smoke:e2e

      - name: Prebuild
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Prepare Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Resolve release signing env (secrets or vars)
        run: |
          echo "ANDROID_KEYSTORE_BASE64=${ANDROID_KEYSTORE_BASE64_SECRET:-$ANDROID_KEYSTORE_BASE64_VAR}" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD_SECRET:-$ANDROID_KEYSTORE_PASSWORD_VAR}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS_SECRET:-$ANDROID_KEY_ALIAS_VAR}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD_SECRET:-$ANDROID_KEY_PASSWORD_VAR}" >> $GITHUB_ENV

      - name: Configure release keystore (optional)
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "BILLTAP_UPLOAD_STORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "BILLTAP_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "BILLTAP_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
            echo "BILLTAP_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV
            echo "Release signing configured from GitHub secrets/vars."
          else
            echo "::warning::Release signing inputs not fully configured. Build will fall back to debug signing and release SHA1/SHA256 will use debug fingerprints."
            echo "Set ALL of these in Secrets or Variables:"
            echo "- ANDROID_KEYSTORE_BASE64"
            echo "- ANDROID_KEYSTORE_PASSWORD"
            echo "- ANDROID_KEY_ALIAS"
            echo "- ANDROID_KEY_PASSWORD"
          fi

      - name: Ensure debug keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Export signing fingerprints
        run: |
          set -euo pipefail
          mkdir -p build-metadata

          DEBUG_SHA1=$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA1:/{print $2; exit}')
          DEBUG_SHA256=$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}')

          {
            echo "debug_sha1=$DEBUG_SHA1"
            echo "debug_sha256=$DEBUG_SHA256"
          } > build-metadata/signing-fingerprints.txt

          if [ -f android/app/release.keystore ] && [ -n "${BILLTAP_UPLOAD_STORE_PASSWORD:-}" ] && [ -n "${BILLTAP_UPLOAD_KEY_ALIAS:-}" ]; then
            RELEASE_SHA1=$(keytool -list -v -keystore android/app/release.keystore -storepass "$BILLTAP_UPLOAD_STORE_PASSWORD" -alias "$BILLTAP_UPLOAD_KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}')
            RELEASE_SHA256=$(keytool -list -v -keystore android/app/release.keystore -storepass "$BILLTAP_UPLOAD_STORE_PASSWORD" -alias "$BILLTAP_UPLOAD_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')
            {
              echo "release_sha1=$RELEASE_SHA1"
              echo "release_sha256=$RELEASE_SHA256"
              echo "release_signing_mode=release_keystore"
            } >> build-metadata/signing-fingerprints.txt
          else
            {
              echo "release_sha1=$DEBUG_SHA1"
              echo "release_sha256=$DEBUG_SHA256"
              echo "release_signing_mode=debug_fallback_or_missing_release_keystore"
            } >> build-metadata/signing-fingerprints.txt
          fi

          {
            echo "### Android Signing Fingerprints"
            echo ""
            cat build-metadata/signing-fingerprints.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Android Release Artifacts (AAB + APK)
        run: |
          cd android
          ./gradlew --no-daemon --no-parallel --stacktrace \
            -Dorg.gradle.jvmargs='-Xmx4608m -XX:MaxMetaspaceSize=1280m -Dfile.encoding=UTF-8' \
            -Dorg.gradle.workers.max=2 \
            bundleRelease assembleRelease -x lint -x lintVitalRelease

      - name: Upload Artifact (Release AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle-dev
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Artifact (Release APK)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-dev
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Artifact (Signing Fingerprints)
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-fingerprints
          path: build-metadata/signing-fingerprints.txt
          if-no-files-found: error
          retention-days: 14
